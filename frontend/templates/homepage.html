<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>
</head>
<body>
    <h1>StudyBuddy</h1>


        <form method="POST">
            <select name="category" >
                {% for category in categories %}
                    <option value="{{category}}">
                            {{category}}
                    </option>
                {% endfor %}
            
            </select>

            <button type="submit" name="answer" value="{{category}}">Submit</button>
        </form>
    <!-- Connecting study page to home page through hyperlink -->
    <a href="{{ url_for('study') }}">Study Flashcards</a>

</body>
</html>
